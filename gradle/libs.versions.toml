[versions]
agp                 = "9.2.1"
kotlin              = "2.2.10"
composeBom          = "2026.02.01"

# AndroidX
coreKtx             = "1.10.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose     = "1.8.0"
navigationCompose   = "2.8.4"

# Image loading
coil                = "3.2.0"

# Network
retrofit            = "2.11.0"
okhttp              = "4.12.0"

# Coroutines
coroutines          = "1.9.0"

# Google – Auth (Credential Manager)
credentials         = "1.3.0"
googleId            = "1.1.1"

# Google – Maps
playServicesMaps    = "18.2.0"
mapsCompose         = "4.4.1"

# Kakao
kakaoSdk            = "2.20.6"
kakaoMaps           = "2.12.8"

# DataStore
datastore           = "1.1.1"

# Test
junit               = "4.13.2"
junitVersion        = "1.1.5"
espressoCore        = "3.5.1"

# Secrets plugin
secretsPlugin       = "2.0.1"

[libraries]
# Compose BOM – managed
androidx-compose-bom                       = { group = "androidx.compose",          name = "compose-bom",                          version.ref = "composeBom" }
androidx-compose-ui                        = { group = "androidx.compose.ui",        name = "ui" }
androidx-compose-ui-graphics               = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-compose-ui-tooling                = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-compose-ui-tooling-preview        = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest          = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
androidx-compose-ui-test-junit4            = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
androidx-compose-material3                 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended   = { group = "androidx.compose.material",  name = "material-icons-extended" }

# AndroidX
androidx-core-ktx              = { group = "androidx.core",       name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose      = { group = "androidx.activity",   name = "activity-compose",             version.ref = "activityCompose" }
androidx-navigation-compose    = { group = "androidx.navigation",  name = "navigation-compose",           version.ref = "navigationCompose" }

# Image loading
coil-compose       = { group = "io.coil-kt.coil3", name = "coil-compose",        version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Network
retrofit            = { group = "com.squareup.retrofit2", name = "retrofit",            version.ref = "retrofit" }
retrofit-gson       = { group = "com.squareup.retrofit2", name = "converter-gson",       version.ref = "retrofit" }
okhttp-logging      = { group = "com.squareup.okhttp3",   name = "logging-interceptor",  version.ref = "okhttp" }

# Coroutines
coroutines-android  = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Google – Auth
credentials                  = { group = "androidx.credentials",                                   name = "credentials",                    version.ref = "credentials" }
credentials-play-services    = { group = "androidx.credentials",                                   name = "credentials-play-services-auth", version.ref = "credentials" }
google-id                    = { group = "com.google.android.libraries.identity.googleid",         name = "googleid",                       version.ref = "googleId" }

# Google – Maps
play-services-maps  = { group = "com.google.android.gms",   name = "play-services-maps", version.ref = "playServicesMaps" }
maps-compose        = { group = "com.google.maps.android",   name = "maps-compose",       version.ref = "mapsCompose" }

# Kakao
kakao-user  = { group = "com.kakao.sdk",       name = "v2-user",  version.ref = "kakaoSdk" }
kakao-maps  = { group = "com.kakao.maps.open", name = "android",  version.ref = "kakaoMaps" }

# DataStore
datastore-preferences   = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Test
junit                   = { group = "junit",                  name = "junit",          version.ref = "junit" }
androidx-junit          = { group = "androidx.test.ext",      name = "junit",          version.ref = "junitVersion" }
androidx-espresso-core  = { group = "androidx.test.espresso", name = "espresso-core",  version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application",                                                 version.ref = "agp" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",                                     version.ref = "kotlin" }
secrets             = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin",         version    = "2.0.1" }
